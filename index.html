    <script>
      // 渲染前应用主题，避免闪烁
      (function() {
        try {
          var t = localStorage.getItem('oscar-theme');
          var resolved;
          if (t === 'light' || t === 'dark') {
            resolved = t;
          } else {
            // system 或未设置：跟随系统
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) { /* ignore */ }
      })();
      // 渲染前应用 tools 主题（classic / studio），避免闪烁
      (function() {
        try {
          var tt = localStorage.getItem('oscar-tools-theme');
          if (tt !== 'classic' && tt !== 'studio') tt = 'studio';
          document.documentElement.setAttribute('data-tools-theme', tt);
        } catch (e) { /* ignore */ }
      })();
    </script>
